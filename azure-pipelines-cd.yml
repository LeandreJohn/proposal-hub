# HB Proposal Hub — CD pipeline
# Triggered when the CI pipeline finishes on main / dev-nem. Downloads the
# prebuilt static site from that exact CI run and deploys it to Azure Static
# Web Apps with skip_app_build: true (no Oryx rebuild).
#
# Required secret pipeline variables (Pipelines > Edit > Variables > "Keep this
# value secret", or a linked variable group). Get each token from the Static
# Web App > Overview > "Manage deployment token":
#   SWA_TOKEN_MAIN  deployment token for the production Static Web App
#   SWA_TOKEN_DEV   deployment token for the dev Static Web App

trigger: none
pr: none

resources:
  pipelines:
    - pipeline: CI
      source: HB_Proposal_Hub-CI # <-- must match the CI pipeline's name in Azure DevOps
      trigger:
        branches:
          include:
            - main
            - dev-nem

pool:
  vmImage: "ubuntu-latest"

steps:
  - checkout: none

  # Resolves the branch here (macro syntax works in scripts; $[ ] runtime
  # expressions can't read resources.pipeline.*) and sets sourceBranchName and
  # artifactName for the later steps and conditions.
  - script: |
      branch="$(resources.pipeline.CI.sourceBranch)"
      branch="${branch#refs/heads/}"   # "refs/heads/main" -> "main"
      echo "CI run: $(resources.pipeline.CI.runName) (ID $(resources.pipeline.CI.runID))"
      echo "Source branch: ${branch}"
      case "$branch" in
        main|dev-nem) ;;
        *) echo "##vso[task.logissue type=error]Unexpected branch '${branch}'"; exit 1 ;;
      esac
      echo "##vso[task.setvariable variable=sourceBranchName]${branch}"
      echo "##vso[task.setvariable variable=artifactName]hb-proposal-hub-${branch}"
    displayName: "Resolve artifact for branch"

  # Downloads from the CI run that triggered this pipeline (not just "latest").
  - download: CI
    artifact: $(artifactName)
    displayName: "Download build artifact"

  - script: find "$(Pipeline.Workspace)/CI/$(artifactName)" -maxdepth 2
    displayName: "List artifact contents"

  - task: AzureStaticWebApp@0
    displayName: "Deploy to Azure Static Web App (production)"
    condition: and(succeeded(), eq(variables['sourceBranchName'], 'main'))
    inputs:
      workingDirectory: "$(Pipeline.Workspace)/CI"
      app_location: "$(artifactName)"
      output_location: ""
      skip_app_build: true
      skip_api_build: true
      azure_static_web_apps_api_token: $(SWA_TOKEN_MAIN)

  - task: AzureStaticWebApp@0
    displayName: "Deploy to Azure Static Web App (dev)"
    condition: and(succeeded(), eq(variables['sourceBranchName'], 'dev-nem'))
    inputs:
      workingDirectory: "$(Pipeline.Workspace)/CI"
      app_location: "$(artifactName)"
      output_location: ""
      skip_app_build: true
      skip_api_build: true
      azure_static_web_apps_api_token: $(SWA_TOKEN_DEV)